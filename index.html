<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Блогер 3.0</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
body{background:radial-gradient(circle at 20% 0%,#2b1055,#0b0416 60%);color:#fff;min-height:100vh;overflow-x:hidden}
#app{max-width:560px;margin:0 auto;padding:8px 10px 84px}
.hud{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:8px}
.stat{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:7px 9px}
.stat .lbl{font-size:9px;opacity:.55;text-transform:uppercase;letter-spacing:.5px}
.stat .val{font-size:15px;font-weight:700;margin-top:1px}
.money .val{color:#7dff9b}.subs .val{color:#ff7dd6}.fame .val{color:#ffd76e}
.ebar{height:7px;background:rgba(255,255,255,.1);border-radius:6px;overflow:hidden;margin-bottom:4px}
.efill{height:100%;background:linear-gradient(90deg,#00d4ff,#7d5cff);transition:width .1s linear;border-radius:6px}
.elbl{font-size:10px;opacity:.55;text-align:right;margin-bottom:8px}
.view{display:none;animation:fade .25s}.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.scene-wrap{position:relative;width:100%;aspect-ratio:400/360;border-radius:18px;overflow:hidden;box-shadow:0 8px 30px rgba(125,92,255,.35),inset 0 0 0 1px rgba(255,255,255,.08);margin-bottom:10px;background:#05020a;touch-action:manipulation;cursor:pointer;transition:transform .08s}
.scene-wrap:active{transform:scale(.985)}
#scene{width:100%;height:100%;display:block;pointer-events:none}
.float{position:absolute;pointer-events:none;font-weight:800;font-size:18px;color:#ff7dd6;animation:floatUp 1.1s ease-out forwards;text-shadow:0 0 10px rgba(255,125,214,.85),0 2px 4px rgba(0,0,0,.6);z-index:5}
@keyframes floatUp{0%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-100px) scale(1.35)}}
.hint{font-size:12px;opacity:.6;margin-bottom:10px;text-align:center}
.combo{font-size:20px;font-weight:800;color:#ffd76e;text-shadow:0 0 14px rgba(255,215,110,.9);height:24px;margin:0 0 6px;text-align:center}
.btn{width:100%;padding:12px;border:none;border-radius:12px;background:linear-gradient(135deg,#ff4ec4,#7d5cff);color:#fff;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 5px 16px rgba(255,78,196,.3);margin-bottom:9px}
.btn:disabled{opacity:.32;box-shadow:none}
.btn.active{background:linear-gradient(135deg,#00d4ff,#7d5cff)}
.btn.alt{background:linear-gradient(135deg,#7dff9b,#00d4ff);color:#062}
.btn.danger{background:linear-gradient(135deg,#ff4e4e,#ff9d4e)}
.sec{font-size:12px;text-transform:uppercase;letter-spacing:1px;opacity:.5;margin:14px 0 8px;font-weight:700}
.up{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:12px;padding:10px;cursor:pointer;transition:.12s;margin-bottom:7px}
.up:active{transform:scale(.98)}
.up.can{border-color:rgba(125,255,155,.55);background:rgba(125,255,155,.08)}
.up.lock{opacity:.42}
.up.owned{border-color:rgba(255,215,110,.5);background:rgba(255,215,110,.08);opacity:.85;cursor:default}
.up .ico{font-size:24px;width:34px;text-align:center}
.up .info{flex:1;min-width:0}
.up .name{font-weight:700;font-size:13px}
.up .name .lvl{color:#7dff9b;font-size:11px;margin-left:4px}
.up .desc{font-size:10.5px;opacity:.62;margin-top:1px;line-height:1.3}
.up .cost{font-size:12px;font-weight:700;color:#ffd76e;white-space:nowrap}
.ach{display:flex;gap:9px;padding:9px;background:rgba(255,255,255,.04);border-radius:10px;margin-bottom:6px;border:1px solid rgba(255,255,255,.07);opacity:.4}
.ach.done{opacity:1;border-color:rgba(255,215,110,.5);background:rgba(255,215,110,.07)}
.ach .ico{font-size:22px;width:30px;text-align:center}
.ach .n{font-weight:700;font-size:12.5px}.ach .d{font-size:10.5px;opacity:.7}
#log{font-size:11.5px;line-height:1.55;max-height:150px;overflow:hidden;margin-top:6px}
#log div{padding:2px 0}
#tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(11,4,22,.96);border-top:1px solid rgba(255,255,255,.09);display:flex;justify-content:space-around;padding:6px 0 10px;backdrop-filter:blur(12px);z-index:50;max-width:560px;margin:0 auto}
#tabs .tab{flex:1;min-width:40px;text-align:center;padding:4px 1px;cursor:pointer;opacity:.5;transition:.15s}
#tabs .tab.on{opacity:1;transform:translateY(-2px)}
#tabs .tab .i{font-size:18px;display:block}
#tabs .tab .l{font-size:8.5px;margin-top:1px;font-weight:600}
#popup{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;backdrop-filter:blur(6px)}
#popup.show{display:flex}
.pop{background:linear-gradient(160deg,#2b1055,#160a2b);border:1px solid rgba(255,255,255,.15);border-radius:18px;padding:22px;max-width:340px;width:100%;text-align:center}
.pop h2{font-size:20px;margin-bottom:8px}.pop p{font-size:13.5px;opacity:.85;line-height:1.5;margin-bottom:16px}
.stat-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:12.5px}
.stat-row b{color:#7dff9b;font-weight:700}
.badge{display:inline-block;padding:3px 8px;border-radius:8px;font-size:10px;font-weight:700;background:rgba(255,215,110,.2);color:#ffd76e;margin-left:6px}
</style>
</head>
<body>
<div id="app">
  <div class="hud">
    <div class="stat money"><div class="lbl">Деньги</div><div class="val" id="m">0 ₽</div></div>
    <div class="stat subs"><div class="lbl">Подписчики</div><div class="val" id="s">0</div></div>
    <div class="stat fame"><div class="lbl">Слава ⭐</div><div class="val" id="f">0</div></div>
  </div>
  <div class="ebar"><div class="efill" id="ef"></div></div>
  <div class="elbl" id="el">20/20 ⚡</div>

  <div class="view active" id="v-home">
    <div class="scene-wrap" id="sceneWrap">
      <svg id="scene" viewBox="0 0 400 360" preserveAspectRatio="xMidYMid meet">
        <defs>
          <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
            <stop id="wallTop" offset="0" stop-color="#3a2f5a"/>
            <stop id="wallBot" offset="1" stop-color="#1a0f2a"/>
          </linearGradient>
          <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#231a30"/>
            <stop offset="1" stop-color="#100818"/>
          </linearGradient>
          <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#0a0a3a"/>
            <stop offset="0.6" stop-color="#3a1a5a"/>
            <stop offset="1" stop-color="#7a2a5a"/>
          </linearGradient>
          <linearGradient id="ledGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#ff4ec4"/>
            <stop offset="0.5" stop-color="#7d5cff"/>
            <stop offset="1" stop-color="#00d4ff"/>
          </linearGradient>
          <linearGradient id="carpetGrad" x1="0" y1="0" x2="1" y2="1">
            <stop id="carA" offset="0" stop-color="#4a1a4a"/>
            <stop id="carB" offset="1" stop-color="#2a0a2a"/>
          </linearGradient>
          <radialGradient id="monGlow" cx="0.5" cy="0.5">
            <stop offset="0" stop-color="#7d5cff" stop-opacity="0.7"/>
            <stop offset="1" stop-color="#7d5cff" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="lampGlow" cx="0.5" cy="0.2">
            <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.9"/>
            <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="ringGlow" cx="0.5" cy="0.5">
            <stop offset="0" stop-color="#fff" stop-opacity="0.5"/>
            <stop offset="1" stop-color="#fff" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="deskGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#8a6a4a"/>
            <stop offset="0.3" stop-color="#6a4a2a"/>
            <stop offset="1" stop-color="#3a2010"/>
          </linearGradient>
          <linearGradient id="chairGrad" x1="0" y1="0" x2="1" y2="1">
            <stop id="chairA" offset="0" stop-color="#3a2a5a"/>
            <stop id="chairB" offset="1" stop-color="#1a0f2a"/>
          </linearGradient>
        </defs>

        <!-- CEILING -->
        <rect x="0" y="0" width="400" height="20" fill="#05020a"/>
        <rect x="0" y="18" width="400" height="3" fill="#1a0f2a"/>
        <!-- LED STRIP -->
        <g id="s-led" style="display:none">
          <rect x="10" y="20" width="380" height="4" rx="2" fill="url(#ledGrad)"/>
          <rect x="10" y="24" width="380" height="18" fill="url(#ledGrad)" opacity="0.3"/>
        </g>

        <!-- WALL -->
        <rect x="0" y="22" width="400" height="210" fill="url(#wallGrad)"/>
        <!-- Wallpaper subtle pattern -->
        <g opacity="0.04">
          <circle cx="30" cy="60" r="2" fill="#fff"/>
          <circle cx="70" cy="90" r="2" fill="#fff"/>
          <circle cx="110" cy="60" r="2" fill="#fff"/>
          <circle cx="150" cy="90" r="2" fill="#fff"/>
          <circle cx="190" cy="60" r="2" fill="#fff"/>
          <circle cx="270" cy="60" r="2" fill="#fff"/>
          <circle cx="310" cy="90" r="2" fill="#fff"/>
          <circle cx="350" cy="60" r="2" fill="#fff"/>
          <circle cx="390" cy="90" r="2" fill="#fff"/>
        </g>

        <!-- WINDOW (tier 2+) -->
        <g id="s-window" style="display:none">
          <rect x="14" y="40" width="118" height="150" rx="6" fill="#0a0a1e" stroke="#7a6a9a" stroke-width="5"/>
          <rect x="20" y="46" width="106" height="138" fill="url(#skyGrad)"/>
          <!-- stars -->
          <g fill="#fff">
            <circle cx="36" cy="60" r="1" opacity="0.9"/>
            <circle cx="85" cy="58" r="1" opacity="0.9"/>
            <circle cx="50" cy="78" r="0.8" opacity="0.7"/>
            <circle cx="110" cy="70" r="0.8" opacity="0.8"/>
            <circle cx="68" cy="52" r="0.6" opacity="0.6"/>
          </g>
          <!-- Moon -->
          <circle cx="112" cy="72" r="9" fill="#ffe9a8"/>
          <circle cx="109" cy="69" r="9" fill="#1a1a4a"/>
          <!-- Skyline layers -->
          <g fill="#0f0f30">
            <rect x="22" y="145" width="10" height="39"/>
            <rect x="34" y="125" width="13" height="59"/>
            <rect x="50" y="150" width="8" height="34"/>
            <rect x="60" y="132" width="11" height="52"/>
            <rect x="74" y="142" width="9" height="42"/>
            <rect x="86" y="126" width="13" height="58"/>
            <rect x="102" y="145" width="10" height="39"/>
            <rect x="115" y="138" width="11" height="46"/>
          </g>
          <g fill="#ffd76e" opacity="0.85">
            <circle cx="26" cy="152" r="0.7"/><circle cx="29" cy="158" r="0.7"/>
            <circle cx="39" cy="132" r="0.7"/><circle cx="44" cy="142" r="0.7"/>
            <circle cx="64" cy="140" r="0.7"/><circle cx="68" cy="152" r="0.7"/>
            <circle cx="90" cy="134" r="0.7"/><circle cx="94" cy="148" r="0.7"/>
            <circle cx="118" cy="146" r="0.7"/>
          </g>
          <!-- street -->
          <rect x="20" y="180" width="106" height="4" fill="#050510"/>
          <!-- CAR IN WINDOW -->
          <g id="s-carwin" style="display:none"></g>
          <!-- window cross -->
          <line x1="73" y1="46" x2="73" y2="184" stroke="#7a6a9a" stroke-width="3"/>
          <line x1="20" y1="120" x2="126" y2="120" stroke="#7a6a9a" stroke-width="3"/>
          <!-- sill -->
          <rect x="8" y="186" width="130" height="8" rx="2" fill="#7a6a9a"/>
          <g id="s-win-plant" style="display:none">
            <rect x="90" y="178" width="14" height="12" rx="2" fill="#8a5a3a"/>
            <ellipse cx="97" cy="174" rx="9" ry="6" fill="#2a8a3a"/>
            <ellipse cx="92" cy="170" rx="5" ry="4" fill="#3a9a4a"/>
            <ellipse cx="102" cy="171" rx="5" ry="4" fill="#3a9a4a"/>
            <circle cx="97" cy="167" r="2.5" fill="#ff4ec4"/>
          </g>
        </g>

        <!-- POSTERS -->
        <g id="s-posters" style="display:none">
          <rect x="278" y="48" width="52" height="66" rx="3" fill="#4a2a6a" stroke="#7d5cff" stroke-width="2"/>
          <text x="304" y="76" text-anchor="middle" font-size="12" fill="#ffd76e" font-weight="bold">GOAL</text>
          <text x="304" y="94" text-anchor="middle" font-size="9" fill="#fff" opacity="0.75">1M SUBS</text>
          <text x="304" y="106" text-anchor="middle" font-size="10" fill="#ff4ec4">★</text>
          <rect x="336" y="52" width="42" height="56" rx="3" fill="#1a2a4a" stroke="#00d4ff" stroke-width="2"/>
          <circle cx="357" cy="78" r="11" fill="#00d4ff" opacity="0.35"/>
          <polygon points="354,72 354,84 366,78" fill="#fff"/>
        </g>

        <!-- RGB / NIGHT light on wall (tier 5) -->
        <g id="s-wallglow" style="display:none">
          <ellipse cx="200" cy="100" rx="180" ry="90" fill="#7d5cff" opacity="0.08"/>
        </g>

        <!-- WALL SHELF (tier 3+) -->
        <g id="s-shelf" style="display:none">
          <rect x="230" y="130" width="164" height="5" rx="2" fill="#7a5a3a"/>
          <rect x="230" y="135" width="164" height="3" fill="#4a3018" opacity="0.8"/>
          <!-- books -->
          <rect x="238" y="110" width="8" height="20" fill="#7d5cff"/>
          <rect x="248" y="106" width="7" height="24" fill="#ff4ec4"/>
          <rect x="257" y="114" width="10" height="16" fill="#00d4ff"/>
          <rect x="269" y="108" width="6" height="22" fill="#ffd76e"/>
          <!-- figurines -->
          <circle cx="290" cy="118" r="5" fill="#ff7dd6"/>
          <rect x="286" y="122" width="8" height="8" rx="2" fill="#ff7dd6"/>
          <rect x="306" y="118" width="9" height="12" rx="2" fill="#7dff9b"/>
          <circle cx="310.5" cy="115" r="4.5" fill="#7dff9b"/>
          <!-- frame -->
          <rect x="330" y="100" width="34" height="30" rx="2" fill="#2a1a4a" stroke="#ffd76e" stroke-width="1.5"/>
          <text x="347" y="122" text-anchor="middle" font-size="14" fill="#ffd76e">★</text>
          <!-- trophy -->
          <rect x="372" y="118" width="10" height="12" rx="1" fill="#ffd76e"/>
          <path d="M 372 118 Q 377 110 382 118" fill="#ffd76e"/>
        </g>

        <!-- FLOOR -->
        <rect x="0" y="232" width="400" height="128" fill="url(#floorGrad)"/>
        <line x1="0" y1="232" x2="400" y2="232" stroke="#000" stroke-width="1.5" opacity="0.6"/>
        <!-- floor reflection from LED -->
        <g id="s-floor-reflect" style="display:none">
          <rect x="10" y="233" width="380" height="8" fill="url(#ledGrad)" opacity="0.2"/>
        </g>

        <!-- CARPET -->
        <g id="s-carpet">
          <ellipse cx="200" cy="320" rx="190" ry="32" fill="url(#carpetGrad)"/>
          <ellipse cx="200" cy="320" rx="172" ry="26" fill="none" stroke="#ff4ec4" stroke-width="1.5" opacity="0.5"/>
          <ellipse cx="200" cy="320" rx="140" ry="18" fill="none" stroke="#7d5cff" stroke-width="1.5" opacity="0.5"/>
          <ellipse cx="200" cy="320" rx="95" ry="11" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.5"/>
          <!-- diamond pattern -->
          <path d="M 200 295 L 220 320 L 200 345 L 180 320 Z" fill="none" stroke="#ffd76e" stroke-width="0.8" opacity="0.3"/>
          <path d="M 145 305 L 165 320 L 145 335 L 125 320 Z" fill="none" stroke="#ffd76e" stroke-width="0.8" opacity="0.25"/>
          <path d="M 255 305 L 275 320 L 255 335 L 235 320 Z" fill="none" stroke="#ffd76e" stroke-width="0.8" opacity="0.25"/>
        </g>

        <!-- FLOOR PLANTS -->
        <g id="s-plant-left" style="display:none">
          <ellipse cx="42" cy="248" rx="22" ry="6" fill="#000" opacity="0.4"/>
          <rect x="30" y="220" width="24" height="26" rx="4" fill="#8a5a3a"/>
          <rect x="28" y="218" width="28" height="6" rx="2" fill="#a06a4a"/>
          <ellipse cx="42" cy="205" rx="22" ry="16" fill="#1a6a2a"/>
          <ellipse cx="32" cy="200" rx="12" ry="10" fill="#2a8a3a"/>
          <ellipse cx="52" cy="201" rx="12" ry="10" fill="#2a8a3a"/>
          <ellipse cx="42" cy="194" rx="14" ry="11" fill="#3aaa4a"/>
          <ellipse cx="36" cy="188" rx="8" ry="7" fill="#4aba5a"/>
        </g>
        <g id="s-plant-right" style="display:none">
          <ellipse cx="358" cy="248" rx="20" ry="6" fill="#000" opacity="0.4"/>
          <rect x="348" y="222" width="22" height="24" rx="4" fill="#8a5a3a"/>
          <rect x="346" y="220" width="26" height="6" rx="2" fill="#a06a4a"/>
          <path d="M 359 222 Q 359 195 342 182 M 359 222 Q 365 195 378 188 M 359 222 Q 359 200 359 178" fill="none" stroke="#1a6a2a" stroke-width="3" stroke-linecap="round"/>
          <ellipse cx="342" cy="180" rx="7" ry="6" fill="#2a8a3a"/>
          <ellipse cx="378" cy="186" rx="7" ry="6" fill="#2a8a3a"/>
          <ellipse cx="359" cy="176" rx="8" ry="7" fill="#3aaa4a"/>
        </g>

        <!-- AQUARIUM (tier 4) -->
        <g id="s-aquarium" style="display:none">
          <rect x="20" y="176" width="60" height="42" rx="4" fill="#0a2a4a" stroke="#3a5a7a" stroke-width="2" opacity="0.95"/>
          <rect x="22" y="178" width="56" height="38" fill="#1a5a8a" opacity="0.6"/>
          <!-- water plants -->
          <path d="M 30 214 Q 32 200 30 190 M 38 214 Q 40 202 42 192 M 52 214 Q 54 204 52 196" fill="none" stroke="#2a8a3a" stroke-width="2"/>
          <!-- fish -->
          <g>
            <ellipse id="s-fish1" cx="45" cy="200" rx="6" ry="3.5" fill="#ff7dd6">
              <animate attributeName="cx" values="32;58;32" dur="6s" repeatCount="indefinite"/>
            </ellipse>
            <polygon points="39,200 35,197 35,203" fill="#ff4ec4">
              <animate attributeName="points" values="39,200 35,197 35,203;33,200 29,197 29,203;39,200 35,197 35,203" dur="6s" repeatCount="indefinite"/>

          </g>

            <ellipse id="s-fish2" cx="55" cy="208" rx="4" ry="2.5" fill="#00d4ff">

            <animate attributeName="cy" values="214;180" dur="4s" repeatCount="indefinite"/>

          </circle>
          <!-- top rim -->
          <rect x="18" y="174" width="64" height="4" rx="1" fill="#3a5a7a"/>
        </g>

        <!-- PET (tier 5) -->
        <g id="s-pet" style="display:none">
          <ellipse cx="90" cy="300" rx="20" ry="10" fill="#000" opacity="0.3"/>
          <ellipse cx="90" cy="294" rx="18" ry="10" fill="#3a3a3a"/>
          <circle cx="108" cy="292" r="7" fill="#3a3a3a"/>
          <ellipse cx="110" cy="294" rx="4" ry="2" fill="#4a4a4a"/>
          <circle cx="110" cy="289" r="1.5" fill="#000"/>
          <circle cx="113" cy="289" r="1.5" fill="#000"/>
          <polygon points="104,286 106,281 108,286" fill="#3a3a3a"/>
          <polygon points="107,286 109,281 111,286" fill="#3a3a3a"/>
          <path d="M 72 294 Q 66 284 72 278" fill="none" stroke="#3a3a3a" stroke-width="3.5" stroke-linecap="round"/>
          <circle cx="111" cy="294" r="1.5" fill="#ff7dd6"/>
          <circle cx="82" cy="290" r="3" fill="#1a1a1a" opacity="0.4"/>
        </g>

        <!-- MONITOR GLOW -->
        <ellipse id="s-glow" cx="200" cy="180" rx="140" ry="95" fill="url(#monGlow)" opacity="0.7"/>

        <!-- MONITORS -->
        <g id="s-mon1">
          <!-- Main ultrawide monitor -->
          <rect x="170" y="112" width="60" height="128" rx="6" fill="#050510" stroke="#1a1a30" stroke-width="3"/>
          <rect x="173" y="115" width="54" height="122" rx="4" fill="#0a0a1a"/>
          <!-- Screen content -->

function boostM(){ return Date.now()<S.boostUntil ? 3 : 1; }
function viralM(){ return Date.now()<S.viralBuffUntil ? 2 : 1; }
function scandalM(){ return Date.now()<S.scandalUntil ? 0.5 : 1; }
function prestigeM(){ return 1 + S.prestige*0.5; }
function talentM(){ return 1 + (S.skills.talent||0)*0.1; }
function globalMult(){
  const u = S.upgrades;
  let m = 1;
  for(const up of UPGRADES) if(up.eff==='global') m += (u[up.id]||0)*up.val;
  if(S.oneTime.school) m *= 1.3;
  return m * prestigeM() * talentM() * (S.skills.legend?2:1);
}
function platformSubsM(){ return (PLATFORMS.find(p=>p.id===S.platform)||PLATFORMS[0]).subsM; }
function platformMoneyM(){ return (PLATFORMS.find(p=>p.id===S.platform)||PLATFORMS[0]).moneyM; }
function comboMult(){ return 1 + S.combo * (0.15 + (S.skills.combo||0)*0.03); }
function subsPerPost(){
  const u = S.upgrades;
  let base = 5;
  for(const up of UPGRADES) if(up.eff==='subsPost') base += (u[up.id]||0)*up.val;
  return base * platformSubsM() * globalMult() * boostM() * viralM() * scandalM() * comboMult();
}
function moneyPerPost(){
  const u = S.upgrades;
  let m = 1;
  for(const up of UPGRADES) if(up.eff==='moneyMult') m += (u[up.id]||0)*up.val;
  if(S.oneTime.brand) m *= 2;
  return subsPerPost() * 0.5 * m * platformMoneyM();
}
function passiveSubsBase(s){
  const u = S.upgrades;
  let p = 0;
  for(const up of UPGRADES) if(up.eff==='passSubs') p += (u[up.id]||0)*up.val;
  if(S.oneTime.app) p *= 1.5;
  return p;
}
function passiveSubsPerSec(){
  return passiveSubsBase(S) * globalMult() * platformSubsM() * boostM() * viralM() * scandalM();
}
function passiveMoneyPerSec(){
  const u = S.upgrades;
  let p = S.subs * 0.0015;
  for(const up of UPGRADES) if(up.eff==='passMoney') p += (u[up.id]||0)*up.val;
  if(S.oneTime.merch) p += S.subs * 0.01;
  if(S.oneTime.sponsor) p += 50;
  return p * globalMult() * platformMoneyM() * boostM() * scandalM();
}
function upgCost(u, lvl){ return Math.floor(u.base * Math.pow(u.growth, lvl)); }
function boostPrice(){ return Math.floor(200 + S.subs*0.1 + S.posts*10); }

let lastTap = 0;
function doPost(){
  if(S.energy < 5){ toast('Мало энергии ⚡', '#ff8080'); return; }
  const now = Date.now();
  if(now - lastTap < 1400) S.combo = Math.min(50, S.combo + 1); else S.combo = 1;
  S.comboUntil = now + 1500;
  lastTap = now;

  S.energy -= 5;
  S.posts++;

  let subs = subsPerPost();
  let money = moneyPerPost();

  const viralChance = 0.05 + (S.skills.viral||0)*0.04;
  if(Math.random() < viralChance){
    const bonus = subs * 15;
    S.subs += bonus; S.money += bonus * 2;
    S.viral++;
    showPopup('🔥','ВИРУСНЫЙ РОЛИК!', `+${fmt(subs)} подписчиков и бонус ${fmt(bonus)}!`);
    beep(880,0.1,'triangle',0.08);
  }

  S.subs += subs;
  S.money += money;

  floatText(`+${fmt(subs)} 👥`, S.combo>3?'#ffd76e':'#ff7dd6');
  if(navigator.vibrate) navigator.vibrate(12);
  beep(200 + Math.min(S.combo,20)*30, 0.04,'square',0.03);
  render();
}

function buyUpg(id){
  const u = UPGRADES.find(x=>x.id===id);
  const lvl = S.upgrades[id]||0;
  const c = upgCost(u, lvl);
  if(S.money < c){ toast('Не хватает денег 💸','#ff8080'); return; }
  S.money -= c;
  S.upgrades[id] = lvl + 1;
  toast(`${u.ico} ${u.name} → ур.${lvl+1}`,'#7dff9b');
  beep(660,0.07,'sine',0.05);
  if(navigator.vibrate) navigator.vibrate(18);
  render();
}

function buyCar(id){
  const car = CARS.find(x=>x.id===id);
  if(!S.cars) S.cars = [];
  if(S.cars.includes(id)) return;
  if(S.money < car.cost){ toast('Не хватает денег 💸','#ff8080'); return; }
  S.money -= car.cost;
  S.cars.push(id);
  showPopup(car.ico, `Куплено: ${car.name}!`, `${car.desc}. Теперь видно в гараже и на улице.`);
  beep(880,0.15,'triangle',0.08);
  if(navigator.vibrate) navigator.vibrate([30,50,30]);
  render();
}

function buySkill(id){
  const sk = SKILLS.find(x=>x.id===id);
  const lvl = S.skills[id]||0;
  if(lvl >= sk.max) return;
  const cost = sk.cost * (lvl+1);
  if(S.fame < cost){ toast('Не хватает славы ⭐','#ff8080'); return; }
  S.fame -= cost;
  S.skills[id] = lvl + 1;
  if(id==='energy') S.maxEnergy += 10;
  toast(`${sk.ico} ${sk.name} → ур.${lvl+1}`,'#ffd76e');
  beep(740,0.09,'triangle',0.06); render();
}
function buyShop(id){
  const it = SHOP.find(x=>x.id===id);
  if(S.oneTime[id]) return;
  if(S.money < it.cost){ toast('Не хватает денег 💸','#ff8080'); return; }
  S.money -= it.cost;
  S.oneTime[id] = 1;
  toast(`${it.ico} ${it.name} куплено!`,'#7dff9b');
  beep(880,0.12,'triangle',0.07); render();
}
function buyBoost(){
  if(Date.now() < S.boostUntil) return;
  const p = boostPrice();
  if(S.money < p){ toast('Не хватает денег 💸','#ff8080'); return; }
  S.money -= p;
  S.boostUntil = Date.now()+30000;
  toast('📢 Реклама запущена! ×3','#00d4ff'); beep(600,0.1); render();
}

function tryRandomEvent(){
  const bad = EVENTS.filter(e=>e.type==='bad');
  const good = EVENTS.filter(e=>e.type==='good');
  const prLevel = S.upgrades.pr||0;
  const badChance = Math.max(0.15, 0.4 - prLevel*0.06);
  let ev = Math.random() > badChance ? good[Math.floor(Math.random()*good.length)] : bad[Math.floor(Math.random()*bad.length)];
  ev.act(S);
  showPopup(ev.type==='good'?'✨':'⚠️', ev.title, ev.text);
  beep(ev.type==='good'?880:200, 0.15, ev.type==='good'?'triangle':'sawtooth', 0.08);
  render();
}

function fmt(n){
  n = Math.floor(n);
  if(n < 1000) return n.toString();
  if(n < 1e6) return (n/1e3).toFixed(n<1e4?1:2)+'K';
  if(n < 1e9) return (n/1e6).toFixed(2)+'M';
  if(n < 1e12) return (n/1e9).toFixed(2)+'B';
  if(n < 1e15) return (n/1e12).toFixed(2)+'T';
  return (n/1e15).toFixed(2)+'Q';
}
function toast(msg,color){
  const log = document.getElementById('log');
  const d = document.createElement('div');
  d.textContent = msg; d.style.color = color||'#fff';
  log.prepend(d);
  while(log.children.length > 8) log.lastChild.remove();
}
function floatText(txt,color){
  const zone = document.getElementById('sceneWrap');
  const el = document.createElement('div');
  el.className='float'; el.textContent=txt;
  el.style.color = color||'#ff7dd6';
  el.style.left = (50 + (Math.random()*30-15))+'%';
  el.style.top = '40%';
  zone.appendChild(el);
  setTimeout(()=>el.remove(), 1150);
}
function showPopup(icon,title,html){
  document.getElementById('popContent').innerHTML =
    `<div style="font-size:44px;margin-bottom:6px">${icon}</div>
     <h2>${title}</h2><p>${html}</p>
     <button class="btn" onclick="closePopup()">OK</button>`;
  document.getElementById('popup').classList.add('show');
}
function closePopup(){ document.getElementById('popup').classList.remove('show'); }

let curTab = 'home';
function switchTab(t){
  curTab = t;
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('v-'+t).classList.add('active');
  document.querySelectorAll('#tabs .tab').forEach(x=>x.classList.toggle('on', x.dataset.t===t));
  render();
}

function render(){
  document.getElementById('m').textContent = fmt(S.money)+' ₽';
  document.getElementById('s').textContent = fmt(S.subs);
  document.getElementById('f').textContent = fmt(S.fame);
  const ep = Math.min(100, S.energy/S.maxEnergy*100);
  document.getElementById('ef').style.width = ep+'%';
  document.getElementById('el').textContent = `${Math.floor(S.energy)}/${S.maxEnergy} ⚡`;

  document.getElementById('hint').textContent = `+${fmt(subsPerPost())} 👥 · +${fmt(moneyPerPost())} ₽ за ролик`;

  if(Date.now() < S.comboUntil && S.combo > 1){
    document.getElementById('combo').textContent = `🔥 КОМБО x${S.combo} (${comboMult().toFixed(2)}×)`;
  } else {
    document.getElementById('combo').textContent = '';
    if(S.combo > 1 && Date.now() >= S.comboUntil) S.combo = 0;
  }

  const bb = document.getElementById('boost');
  if(Date.now() < S.boostUntil){
    bb.disabled = true; bb.classList.add('active');
    bb.textContent = `📢 Реклама активна (${Math.ceil((S.boostUntil-Date.now())/1000)}с)`;
  } else {
    bb.disabled = false; bb.classList.remove('active');
    bb.textContent = `📢 Реклама ×3 (30с) — ${fmt(boostPrice())} ₽`;
  }

  updateScene();

  if(curTab === 'upg') renderUpg();
  if(curTab === 'car') renderCar();
  if(curTab === 'skill') renderSkill();
  if(curTab === 'shop') renderShop();
  if(curTab === 'ach') renderAch();
  if(curTab === 'stat') renderStat();
}

function renderUpg(){
  const el = document.getElementById('upgList');
  el.innerHTML = '';
  for(const u of UPGRADES){
    const lvl = S.upgrades[u.id]||0;
    const c = upgCost(u, lvl);
    const can = S.money >= c;
    const d = document.createElement('div');
    d.className = 'up ' + (can?'can':'lock');
    d.innerHTML = `<div class="ico">${u.ico}</div>
      <div class="info"><div class="name">${u.name}<span class="lvl">ур.${lvl}</span></div>
      <div class="desc">${u.desc}</div></div>
      <div class="cost">${fmt(c)} ₽</div>`;
    d.onclick = ()=>buyUpg(u.id);
    el.appendChild(d);
  }
}
function renderCar(){
  const el = document.getElementById('carList');
  el.innerHTML = '';
  if(!S.cars) S.cars = [];
  for(const car of CARS){
    const owned = S.cars.includes(car.id);
    const can = !owned && S.money >= car.cost;
    const d = document.createElement('div');
    d.className = 'up ' + (owned?'owned':(can?'can':'lock'));
    d.innerHTML = `<div class="ico">${car.ico}</div>

      <div class="cost">${owned?'✅':fmt(car.cost)+' ₽'}</div>`;
    d.onclick = ()=>buyCar(car.id);
    el.appendChild(d);
  }

  for(const sk of SKILLS){

    const d = document.createElement('div');
    d.className = 'up ' + (maxed?'owned':(can?'can':'lock'));

      <div class="desc">${sk.desc}</div></div>
      <div class="cost">${maxed?'✅':fmt(cost)+' ⭐'}</div>`;
    d.onclick = ()=>{ if(!maxed) buySkill(sk.id); };
    el.appendChild(d);
  }
}
function renderShop(){
  const el = document.getElementById('shopList');
  el.innerHTML = '';
  for(const it of SHOP){
    const owned = !!S.oneTime[it.id];
    const can = !owned && S.money >= it.cost;
    const d = document.createElement('div');
    d.className = 'up ' + (owned?'owned':(can?'can':'lock'));
    d.innerHTML = `<div class="ico">${it.ico}</div>
      <div class="info"><div class="name">${it.name}${owned?' <span class="badge">куплено</span>':''}</div>
      <div class="desc">${it.desc}</div></div>
      <div class="cost">${owned?'✅':fmt(it.cost)+' ₽'}</div>`;
    d.onclick = ()=>buyShop(it.id);
    el.appendChild(d);
  }
}
function renderAch(){
  const el = document.getElementById('achList');
  el.innerHTML = '';
  for(const a of ACHS){
    const done = !!S.achievements[a.id];
    if(!done && a.check(S)){ S.achievements[a.id] = 1; toast(`🏆 ${a.n}!`,'#ffd76e'); }
    const d = document.createElement('div');
    d.className = 'ach' + (done?' done':'');
    d.innerHTML = `<div class="ico">${a.ico}</div>
      <div><div class="n">${a.n}</div><div class="d">${a.d}</div></div>`;
    el.appendChild(d);
  }
}
function renderStat(){
  const el = document.getElementById('statList');
  const minutes = Math.floor(S.playtime/60);
  const hours = Math.floor(minutes/60);
  el.innerHTML = `
    <div class="stat-row"><span>👥 Подписчиков</span><b>${fmt(S.subs)}</b></div>
    <div class="stat-row"><span>💰 Денег</span><b>${fmt(S.money)} ₽</b></div>
    <div class="stat-row"><span>⭐ Славы</span><b>${fmt(S.fame)}</b></div>
    <div class="stat-row"><span>♻️ Престижей</span><b>${S.prestige}</b></div>
    <div class="stat-row"><span>📹 Роликов</span><b>${fmt(S.posts)}</b></div>
    <div class="stat-row"><span>🔥 Вирусных</span><b>${S.viral}</b></div>
    <div class="stat-row"><span>💥 Скандалов</span><b>${S.scandals}</b></div>
    <div class="stat-row"><span>🚗 Машин</span><b>${(S.cars||[]).length}/${CARS.length}</b></div>
    <div class="stat-row"><span>📈 Множитель</span><b>×${globalMult().toFixed(2)}</b></div>
    <div class="stat-row"><span>📱 Платформа</span><b>${(PLATFORMS.find(p=>p.id===S.platform)||{}).name}</b></div>
    <div class="stat-row"><span>⏱️ В игре</span><b>${hours}ч ${minutes%60}м</b></div>
    <div class="stat-row"><span>👥 Пассив подп./сек</span><b>${fmt(passiveSubsPerSec())}</b></div>
    <div class="stat-row"><span>💰 Пассив ₽/сек</span><b>${fmt(passiveMoneyPerSec())}</b></div>
    <div class="stat-row"><span>🏆 Достижений</span><b>${Object.keys(S.achievements).length}/${ACHS.length}</b></div>`;
}

let last = performance.now();
function loop(now){
  const dt = Math.min(0.5, (now-last)/1000);
  last = now;
  S.playtime += dt;
  S.energy = Math.min(S.maxEnergy, S.energy + dt * (2 + (S.prestige*0.2)));
  S.subs += passiveSubsPerSec() * dt;
  S.money += passiveMoneyPerSec() * dt;

  S.nextEventIn -= dt;
  if(S.nextEventIn <= 0){ tryRandomEvent(); S.nextEventIn = 45 + Math.random()*45; }

  if(Math.floor(S.playtime/120) + 1 > S.day) S.day = Math.floor(S.playtime/120) + 1;

  if(Math.floor(now/1000) !== Math.floor((now-dt*1000)/1000)){
    for(const a of ACHS){
      if(!S.achievements[a.id] && a.check(S)){
        S.achievements[a.id] = 1;
        toast(`🏆 ${a.n}!`,'#ffd76e');
        beep(1000,0.15,'triangle',0.08);
      }
    }
  }
  render();
  requestAnimationFrame(loop);
}

function save(){
  S.lastSave = Date.now();
  try{ localStorage.setItem('blogger3_save', JSON.stringify(S)); }catch(e){}
}
function load(){
  try{
    const raw = localStorage.getItem('blogger3_save') || localStorage.getItem('blogger2_save');
    if(!raw) return JSON.parse(JSON.stringify(DEFAULT));
    const d = JSON.parse(raw);
    const merged = Object.assign({}, JSON.parse(JSON.stringify(DEFAULT)), d);
    if(!merged.cars) merged.cars = [];
    return merged;
  }catch(e){ return JSON.parse(JSON.stringify(DEFAULT)); }
}

const _sw = document.getElementById('sceneWrap');
let _lastTouch = 0;
function _handleTap(e){
  e.preventDefault();
  const now = Date.now();
  if(now - _lastTouch < 200) return;
  _lastTouch = now;
  doPost();
}
_sw.addEventListener('touchstart', _handleTap, {passive:false});
_sw.addEventListener('mousedown', _handleTap);

document.getElementById('boost').onclick = buyBoost;
document.querySelectorAll('#tabs .tab').forEach(t=>{
  t.onclick = ()=>switchTab(t.dataset.t);
});
document.getElementById('popup').onclick = (e)=>{ if(e.target.id==='popup') closePopup(); };

setInterval(save, 5000);
window.addEventListener('beforeunload', save);

render();
requestAnimationFrame(loop);
toast('Добро пожаловать в Блогер 3.0! 🚀','#7dff9b');
toast('Тапай по сцене — снимай контент','#ffd76e');
</script>
</body>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0416">
<title>Блогер TYCOON</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;font-family:-apple-system,"SF Pro Display","Segoe UI",Roboto,sans-serif}
body{background:#05020a;color:#fff;min-height:100vh;overflow-x:hidden;padding-bottom:env(safe-area-inset-bottom)}
#app{max-width:560px;margin:0 auto;padding:8px 10px 110px;position:relative}
.hud{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:10px}
.stat{background:linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:8px 10px;position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent)}
.stat .lbl{font-size:9px;opacity:.55;text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.stat .val{font-size:16px;font-weight:800;margin-top:2px;letter-spacing:-.3px}
.money .val{color:#7dff9b;text-shadow:0 0 12px rgba(125,255,155,.4)}
.subs .val{color:#ff7dd6;text-shadow:0 0 12px rgba(255,125,214,.4)}
.fame .val{color:#ffd76e;text-shadow:0 0 12px rgba(255,215,110,.4)}
.view{display:none}.view.active{display:block;animation:slideIn .3s cubic-bezier(.2,.9,.3,1)}
@keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* STUDIO SCENE */
.scene-wrap{position:relative;width:100%;aspect-ratio:400/300;border-radius:20px;overflow:hidden;box-shadow:0 12px 40px rgba(125,92,255,.35),0 0 0 1px rgba(255,255,255,.1),inset 0 0 60px rgba(0,0,0,.5);margin-bottom:12px;background:#05020a;touch-action:manipulation;cursor:pointer;transition:transform .1s}
.scene-wrap:active{transform:scale(.985)}
#scene{width:100%;height:100%;display:block;pointer-events:none}

/* CONTENT BUTTONS */
.content-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.content-btn{padding:12px 8px;border:none;border-radius:14px;font-weight:800;font-size:12px;cursor:pointer;touch-action:manipulation;text-align:center;transition:transform .1s;box-shadow:0 4px 14px rgba(0,0,0,.4);line-height:1.3}
.content-btn:active{transform:scale(.96)}
.content-btn .ico{font-size:22px;display:block;margin-bottom:3px}
.content-btn .mult{font-size:10px;opacity:.8;font-weight:600;margin-top:2px}
.cb-1{background:linear-gradient(135deg,#7d5cff,#4a2a9a);color:#fff}
.cb-2{background:linear-gradient(135deg,#ff4ec4,#8a1a5a);color:#fff}
.cb-3{background:linear-gradient(135deg,#00d4ff,#005a8a);color:#fff}
.cb-4{background:linear-gradient(135deg,#ffd76e,#8a5a0a);color:#3a2000}

.hint{font-size:12px;opacity:.6;margin-bottom:10px;text-align:center;font-weight:500}
.combo{font-size:22px;font-weight:900;color:#ffd76e;text-shadow:0 0 20px rgba(255,215,110,1),0 2px 6px rgba(0,0,0,.6);height:28px;margin:4px 0 6px;text-align:center;letter-spacing:-.5px;transition:opacity .2s}
.combo:empty{opacity:0}

.sec{font-size:12px;text-transform:uppercase;letter-spacing:1.5px;opacity:.5;margin:18px 0 10px;font-weight:800}
.up{display:flex;align-items:center;gap:12px;background:linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:12px;cursor:pointer;margin-bottom:8px;touch-action:manipulation;transition:transform .1s,border-color .2s;position:relative;overflow:hidden}
.up:active{transform:scale(.98)}
.up.can{border-color:rgba(125,255,155,.5);background:linear-gradient(145deg,rgba(125,255,155,.1),rgba(125,255,155,.03));box-shadow:0 0 20px rgba(125,255,155,.15)}
.up.can::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,#7dff9b,#00d4ff);border-radius:16px 0 0 16px}
.up.lock{opacity:.5}
.up.owned{border-color:rgba(255,215,110,.5);background:linear-gradient(145deg,rgba(255,215,110,.1),rgba(255,215,110,.02));cursor:default}
.up.owned::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,#ffd76e,#ff9d4e);border-radius:16px 0 0 16px}
.up .ico{font-size:26px;width:38px;text-align:center;flex-shrink:0}
.up .info{flex:1;min-width:0}
.up .name{font-weight:800;font-size:13.5px;letter-spacing:-.2px}
.up .name .lvl{color:#7dff9b;font-size:11px;margin-left:5px;font-weight:700}
.up .desc{font-size:11px;opacity:.65;margin-top:2px;line-height:1.35}
.up .cost{font-size:13px;font-weight:800;color:#ffd76e;white-space:nowrap;text-shadow:0 0 8px rgba(255,215,110,.4)}
.ach{display:flex;gap:10px;padding:10px 12px;background:linear-gradient(145deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border-radius:14px;margin-bottom:7px;border:1px solid rgba(255,255,255,.08);opacity:.4}
.ach.done{opacity:1;border-color:rgba(255,215,110,.5);background:linear-gradient(145deg,rgba(255,215,110,.1),rgba(255,215,110,.03));box-shadow:0 0 18px rgba(255,215,110,.15)}
.ach .ico{font-size:24px;width:32px;text-align:center}
.ach .n{font-weight:800;font-size:13px;letter-spacing:-.2px}
.ach .d{font-size:11px;opacity:.7;margin-top:1px}
#log{font-size:12px;line-height:1.55;max-height:160px;overflow:hidden;margin-top:6px}
#log div{padding:3px 0;font-weight:600}
#tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(8,3,16,.98);border-top:1px solid rgba(255,255,255,.1);display:flex;justify-content:space-around;padding:8px 0 calc(12px + env(safe-area-inset-bottom));backdrop-filter:blur(20px);z-index:50;max-width:560px;margin:0 auto}
#tabs .tab{flex:1;min-width:30px;text-align:center;padding:6px 1px;cursor:pointer;opacity:.5;transition:opacity .2s,transform .15s;touch-action:manipulation;position:relative}
#tabs .tab.on{opacity:1;transform:translateY(-3px)}
#tabs .tab.on::before{content:'';position:absolute;top:-3px;left:50%;transform:translateX(-50%);width:22px;height:3px;background:linear-gradient(90deg,#ff4ec4,#7d5cff);border-radius:2px;box-shadow:0 0 12px rgba(255,78,196,.8)}
#tabs .tab .i{font-size:19px;display:block;pointer-events:none}
#tabs .tab .l{font-size:8px;margin-top:2px;font-weight:700;pointer-events:none}
#popup{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;backdrop-filter:blur(8px)}
#popup.show{display:flex;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.pop{background:linear-gradient(160deg,#2b1055,#0f0520);border:1px solid rgba(255,255,255,.15);border-radius:22px;padding:26px 22px;max-width:340px;width:100%;text-align:center;animation:popIn .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes popIn{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.pop h2{font-size:22px;margin-bottom:10px;font-weight:900}
.pop p{font-size:14px;opacity:.9;line-height:1.55;margin-bottom:18px}
.btn{width:100%;padding:14px;border:none;border-radius:14px;background:linear-gradient(135deg,#ff4ec4,#7d5cff);color:#fff;font-weight:800;font-size:14px;cursor:pointer;box-shadow:0 6px 20px rgba(255,78,196,.4),inset 0 1px 0 rgba(255,255,255,.2);margin-bottom:10px;touch-action:manipulation}
.btn:active{transform:scale(.97)}
.stat-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:13px}
.stat-row:last-child{border-bottom:none}
.stat-row span{opacity:.75}
.stat-row b{color:#7dff9b;font-weight:800}
.badge{display:inline-block;padding:3px 9px;border-radius:8px;font-size:10px;font-weight:800;background:linear-gradient(135deg,rgba(255,215,110,.25),rgba(255,215,110,.1));color:#ffd76e;margin-left:6px}
.float{position:absolute;pointer-events:none;font-weight:900;font-size:20px;color:#ff7dd6;animation:floatUp 1.1s ease-out forwards;text-shadow:0 0 12px rgba(255,125,214,.9),0 2px 6px rgba(0,0,0,.8);z-index:5;letter-spacing:-.5px}
@keyframes floatUp{0%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-110px) scale(1.4)}}
</style>
</head>
<body>

    <div class="stat money"><div class="lbl">Баланс</div><div class="val" id="m">0 ₽</div></div>

  <!-- STUDIO — вид сзади, персонаж за компьютером -->

        <rect x="0" y="20" width="400" height="180" fill="url(#wallGrad)"/>

        <!-- WINDOW -->

          <circle cx="291" cy="249" r="2" fill="#ff4ec4"/>
        </g>

function beep(freq=440, dur=0.06, type='sine', vol=0.05){
  try{
    if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.value=vol; o.connect(g); g.connect(actx.destination);
    o.start(); g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime+dur);
    o.stop(actx.currentTime+dur);
  }catch(e){}
}

function boostM(){ return Date.now()<S.boostUntil ? 3 : 1; }
function viralM(){ return Date.now()<S.viralBuffUntil ? 2 : 1; }
function scandalM(){ return Date.now()<S.scandalUntil ? 0.5 : 1; }
function collabM(){ return Date.now()<S.collabUntil ? 2 : 1; }
function prestigeM(){ return 1 + S.prestige*0.5; }
function talentM(){ return 1 + (S.skills.talent||0)*0.1; }
function houseMult(){ return 1 + (S.houses||[]).length*0.15; }
function collabSkillM(){ return 1 + (S.skills.collab||0)*0.15; }
function globalMult(){
  const u = S.upgrades;
  let m = 1;
  for(const up of UPGRADES) if(up.eff==='global') m += (u[up.id]||0)*up.val;
  if(S.oneTime.school) m *= 1.3;
  if(S.oneTime.outfit) m *= 1.25;
  return m * prestigeM() * talentM() * houseMult() * collabSkillM() * (S.skills.legend?2:1);
}
function contentMult(){ 
  const ct = CONTENT_TYPES[S.contentType];
  return ct.mult * collabM();
}
function contentMoneyMult(){ 
  const ct = CONTENT_TYPES[S.contentType];
  return ct.moneyM;
}
function comboMult(){ return 1 + S.combo * (0.15 + (S.skills.combo||0)*0.03); }
function subsPerPost(){
  const u = S.upgrades;
  let base = 5;
  for(const up of UPGRADES) if(up.eff==='subsPost') base += (u[up.id]||0)*up.val;
  return base * globalMult() * boostM() * viralM() * scandalM() * comboMult() * contentMult();
}
function moneyPerPost(){
  const u = S.upgrades;
  let m = 1;
  for(const up of UPGRADES) if(up.eff==='moneyMult') m += (u[up.id]||0)*up.val;
  if(S.oneTime.brand) m *= 2;
  return subsPerPost() * 0.5 * m * contentMoneyMult();
}
function passiveSubsBase(s){
  const u = S.upgrades;
  let p = 0;
  for(const up of UPGRADES) if(up.eff==='passSubs') p += (u[up.id]||0)*up.val;
  if(S.oneTime.app) p *= 1.5;
  return p;
}
function passiveSubsPerSec(){ return passiveSubsBase(S) * globalMult() * boostM() * viralM() * scandalM(); }
function passiveMoneyPerSec(){
  const u = S.upgrades;
  let p = S.subs * 0.0015;
  for(const up of UPGRADES) if(up.eff==='passMoney') p += (u[up.id]||0)*up.val;
  if(S.oneTime.merch) p += S.subs * 0.01;
  if(S.oneTime.sponsor) p += 50;
  return p * globalMult() * boostM() * scandalM();
}
function upgCost(u, lvl){ return Math.floor(u.base * Math.pow(u.growth, lvl)); }
function boostPrice(){ return Math.floor(200 + S.subs*0.1 + S.posts*10); }

/* SCENE UPDATE */
function updateScene(){
  const u = S.upgrades;
  const total = Object.values(u).reduce((a,b)=>a+b,0) + S.prestige*4 + (S.houses||[]).length*8;
  const tier = Math.min(5, Math.floor(total/12));
  const WALLS = [['#2a1f3a','#0a0518'],['#3a2f5a','#1a0f2a'],['#3a4a6a','#2a2a4a'],['#4a3a6a','#2a1a4a'],['#2a2a4a','#1a1a3a'],['#3a1a5a','#1a0a2a']];
  document.getElementById('wallTop').setAttribute('stop-color', WALLS[tier][0]);
  document.getElementById('wallBot').setAttribute('stop-color', WALLS[tier][1]);
  const show = (id, cond) => { const el = document.getElementById(id); if(el) el.style.display = cond ? 'block' : 'none'; };
  show('s-window', tier >= 2); show('s-led', tier >= 3); show('s-posters', tier >= 1);
  show('s-shelf', tier >= 3); show('s-lamp', (u.light||0) >= 1 && (u.light||0) < 4);
  show('s-ring', (u.light||0) >= 4); show('s-softbox', (u.light||0) >= 7);
  const pc = u.pc||0;
  const monCount = pc===0 ? 1 : pc<3 ? 1 : pc<6 ? 2 : 3;
  show('s-mon2', monCount >= 2); show('s-mon3', monCount >= 3);
  const cam = u.camera||0;
  show('s-camera', cam >= 1 && cam < 4); show('s-camera2', cam >= 4);
  const mic = u.mic||0;
  show('s-mic', mic >= 1 && mic < 4); show('s-mic2', mic >= 4);
  const CHAIR_COLORS = [['#3a2a5a','#1a0f2a'],['#4a3a7a','#2a1a4a'],['#5a4a9a','#3a2a6a'],['#7d5cff','#4a3a9a'],['#ff4ec4','#7a1a5a'],['#ffd76e','#7a6a2a']];
  const ci = Math.min(5, u.chair||0);
  document.getElementById('chairA').setAttribute('stop-color', CHAIR_COLORS[ci][0]);
  document.getElementById('chairB').setAttribute('stop-color', CHAIR_COLORS[ci][1]);
  show('s-kb-led', (u.pc||0) >= 3);
  document.getElementById('s-glow').setAttribute('opacity', 0.4 + monCount*0.15);
}

/* ACTIONS */
function doPost(){
  const now = Date.now();
  if(now - lastTap < 1400) S.combo = Math.min(50, S.combo + 1); else S.combo = 1;
  S.comboUntil = now + 1500;
  lastTap = now;
  S.posts++;
  let subs = subsPerPost();
  let money = moneyPerPost();
  const viralChance = 0.05 + (S.skills.viral||0)*0.04;
  if(Math.random() < viralChance){
    const bonus = subs * 15;
    S.subs += bonus; S.money += bonus * 2;
    S.viral++;
    showPopup('🔥','ВИРУСНЫЙ РОЛИК!', `+${fmt(subs)} подписчиков и бонус ${fmt(bonus)}!`);
    beep(880,0.1,'triangle',0.08);
  }
  S.subs += subs; S.money += money;
  floatText(`+${fmt(subs)} 👥`, S.combo>3?'#ffd76e':'#ff7dd6');
  if(navigator.vibrate) navigator.vibrate(12);
  beep(200 + Math.min(S.combo,20)*30, 0.04,'square',0.03);
  render();
}

function buyUpg(id){
  const u = UPGRADES.find(x=>x.id===id);

  if(S.money < c){ toast('Не хватает денег 💸','#ff8080'); return; }
  S.money -= c;
  S.upgrades[id] = lvl + 1;
  toast(`${u.ico} ${u.name} → ур.${lvl+1}`,'#7dff9b');
  beep(660,0.07,'sine',0.05);
  render();
}

  if(S.money < car.cost){ toast('Не хватает денег 💸','#ff8080'); return; }
  S.money -= car.cost;
  S.cars.push(id);
  showPopup(car.ico, `Куплено: ${car.name}!`, `${car.desc}. Смотри в гараже!`);

}

}

  const sk = SKILLS.find(x=>x.id===id);

  S.fame -= cost;
  S.skills[id] = lvl + 1;
  toast(`${sk.ico} ${sk.name} → ур.${lvl+1}`,'#ffd76e');
  beep(740,0.09,'triangle',0.06); render();
}

  const it = SHOP.find(x=>x.id===id);
  if(S.oneTime[id]) return;
  if(S.money < it.cost){ toast('Не хватает денег 💸','#ff8080'); return; }
  S.money -= it.cost;
  S.oneTime[id] = 1;
  toast(`${it.ico} ${it.name} куплено!`,'#7dff9b');
  beep(880,0.12,'triangle',0.07); render();
}
function buyBoost(){
  if(Date.now() < S.boostUntil) return;
  const p = boostPrice();
  if(S.money < p){ toast('Не хватает денег 💸','#ff8080'); return; }
  S.money -= p;
  S.boostUntil = Date.now()+30000;
  toast('📢 Реклама запущена! ×3','#00d4ff'); beep(600,0.1); render();
}
function tryRandomEvent(){
  const bad = EVENTS.filter(e=>e.type==='bad');
  const good = EVENTS.filter(e=>e.type==='good');
  const badChance = Math.max(0.15, 0.4 - (S.upgrades.pr||0)*0.06);
  let ev = Math.random() > badChance ? good[Math.floor(Math.random()*good.length)] : bad[Math.floor(Math.random()*bad.length)];
  ev.act(S);
  showPopup(ev.type==='good'?'✨':'⚠️', ev.title, ev.text);
  beep(ev.type==='good'?880:200, 0.15, ev.type==='good'?'triangle':'sawtooth', 0.08);
  render();
}

/* HELPERS */
function fmt(n){
  n = Math.floor(n);
  if(n < 1000) return n.toString();
  if(n < 1e6) return (n/1e3).toFixed(n<1e4?1:2)+'K';
  if(n < 1e9) return (n/1e6).toFixed(2)+'M';
  if(n < 1e12) return (n/1e9).toFixed(2)+'B';
  if(n < 1e15) return (n/1e12).toFixed(2)+'T';
  if(n < 1e18) return (n/1e15).toFixed(2)+'Q';
  return (n/1e18).toFixed(2)+'Qi';
}
function toast(msg,color){
  const log = document.getElementById('log');
  if(!log) return;
  const d = document.createElement('div');
  d.textContent = msg; d.style.color = color||'#fff';
  log.prepend(d);
  while(log.children.length > 8) log.lastChild.remove();
}
function floatText(txt,color){
  const zone = document.getElementById('sceneWrap');
  if(!zone) return;
  const el = document.createElement('div');
  el.className='float'; el.textContent=txt;
  el.style.color = color||'#ff7dd6';
  el.style.left = (50 + (Math.random()*30-15))+'%';
  el.style.top = '40%';
  zone.appendChild(el);
  setTimeout(()=>el.remove(), 1150);
}
function showPopup(icon,title,html){
  document.getElementById('popContent').innerHTML =
    `<div style="font-size:48px;margin-bottom:8px">${icon}</div>
     <h2>${title}</h2><p>${html}</p>
     <button class="btn" id="popOkBtn">OK</button>`;
  document.getElementById('popup').classList.add('show');
  setTimeout(()=>{
    const b = document.getElementById('popOkBtn');
    if(b) bindTap(b, closePopup);
  }, 10);
}
function closePopup(){ document.getElementById('popup').classList.remove('show'); }

let curTab = 'home';
function switchTab(t){
  curTab = t;
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  const v = document.getElementById('v-'+t);
  if(v) v.classList.add('active');
  document.querySelectorAll('#tabs .tab').forEach(x=>x.classList.toggle('on', x.dataset.t===t));
  render();
}

/* RENDER */
function render(){
  document.getElementById('m').textContent = fmt(S.money)+' ₽';
  document.getElementById('s').textContent = fmt(S.subs);
  document.getElementById('f').textContent = fmt(S.fame);
  document.getElementById('hint').textContent = `+${fmt(subsPerPost())} 👥 · +${fmt(moneyPerPost())} ₽ за ${CONTENT_TYPES[S.contentType].name.toLowerCase()}`;

  // Content buttons highlight
  for(let i=1;i<=4;i++){
    const btn = document.getElementById('ct-'+i);
    if(btn) btn.style.opacity = S.contentType === i ? '1' : '0.55';
    const multEl = document.getElementById('ct-'+i+'-mult');
    if(multEl) multEl.textContent = '×' + CONTENT_TYPES[i].mult.toFixed(1);
  }

  const comboEl = document.getElementById('combo');
  if(Date.now() < S.comboUntil && S.combo > 1){
    comboEl.textContent = `🔥 КОМБО ×${S.combo} (${comboMult().toFixed(2)}×)`;
  } else {
    comboEl.textContent = '';
    if(S.combo > 1 && Date.now() >= S.comboUntil) S.combo = 0;
  }

  const bb = document.getElementById('boost');
  if(Date.now() < S.boostUntil){
    bb.disabled = true; bb.classList.add('active');
    bb.textContent = `📢 Реклама (${Math.ceil((S.boostUntil-Date.now())/1000)}с)`;
  } else {
    bb.disabled = false; bb.classList.remove('active');
    bb.textContent = `📢 Реклама ×3 (30с) — ${fmt(boostPrice())} ₽`;
  }

  updateScene();
  if(curTab === 'garage') renderCar();
  if(curTab === 'house') renderHouseList();
  if(curTab === 'upg') renderUpg();
  if(curTab === 'skill') renderSkill();
  if(curTab === 'shop') renderShop();
  if(curTab === 'ach') renderAch();
  if(curTab === 'stat') renderStat();
}

function bindListClicks(container){
  container.querySelectorAll('[data-act]').forEach(el=>{
    bindTap(el, ()=>{
      const act = el.dataset.act;
      if(act === 'upg') buyUpg(el.dataset.id);
      else if(act === 'car') buyCar(el.dataset.id);
      else if(act === 'house') buyHouse(el.dataset.id);
      else if(act === 'skill') buySkill(el.dataset.id);
      else if(act === 'shop') buyShop(el.dataset.id);
    });
  });
}

function renderUpg(){
  const el = document.getElementById('upgList');
  el.innerHTML = '';
  for(const u of UPGRADES){
    const lvl = S.upgrades[u.id]||0;
    const c = upgCost(u, lvl);
    const can = S.money >= c;
    const d = document.createElement('div');
    d.className = 'up ' + (can?'can':'lock');
    d.dataset.act = 'upg'; d.dataset.id = u.id;
    d.innerHTML = `<div class="ico">${u.ico}</div><div class="info"><div class="name">${u.name}<span class="lvl">ур.${lvl}</span></div><div class="desc">${u.desc}</div></div><div class="cost">${fmt(c)} ₽</div>`;
    el.appendChild(d);
  }
  bindListClicks(el);
}
function renderCar(){
  const el = document.getElementById('carList');
  el.innerHTML = '';
  if(!S.cars) S.cars = [];
  for(const car of CARS){
    const owned = S.cars.includes(car.id);
    const can = !owned && S.money >= car.cost;
    const d = document.createElement('div');
    d.className = 'up ' + (owned?'owned':(can?'can':'lock'));
    if(!owned){ d.dataset.act = 'car'; d.dataset.id = car.id; }
    d.innerHTML = `<div class="ico">${car.ico}</div><div class="info"><div class="name">${car.name}${owned?' <span class="badge">куплено</span>':''}</div><div class="desc">${car.desc}</div></div><div class="cost">${owned?'✅':fmt(car.cost)+' ₽'}</div>`;
    el.appendChild(d);
  }
  bindListClicks(el);
}
function renderHouseList(){
  const el = document.getElementById('houseList');
  el.innerHTML = '';
  if(!S.houses) S.houses = [];
  for(const h of HOUSES){
    const owned = S.houses.includes(h.id);
    const can = !owned && S.money >= h.cost;
    const d = document.createElement('div');
    d.className = 'up ' + (owned?'owned':(can?'can':'lock'));
    if(!owned){ d.dataset.act = 'house'; d.dataset.id = h.id; }
    d.innerHTML = `<div class="ico">${h.ico}</div><div class="info"><div class="name">${h.name}${owned?' <span class="badge">куплено</span>':''}</div><div class="desc">${h.desc} · +15% ко всему</div></div><div class="cost">${owned?'✅':fmt(h.cost)+' ₽'}</div>`;
    el.appendChild(d);
  }
  bindListClicks(el);
}
function renderSkill(){
  const el = document.getElementById('skillList');
  el.innerHTML = '';
  for(const sk of SKILLS){
    const lvl = S.skills[sk.id]||0;
    const maxed = lvl >= sk.max;
    const cost = sk.cost * (lvl+1);
    const can = !maxed && S.fame >= cost;
    const d = document.createElement('div');
    d.className = 'up ' + (maxed?'owned':(can?'can':'lock'));
    if(!maxed){ d.dataset.act = 'skill'; d.dataset.id = sk.id; }
    d.innerHTML = `<div class="ico">${sk.ico}</div><div class="info"><div class="name">${sk.name}<span class="lvl">ур.${lvl}/${sk.max}</span></div><div class="desc">${sk.desc}</div></div><div class="cost">${maxed?'✅':fmt(cost)+' ⭐'}</div>`;
    el.appendChild(d);
  }
  bindListClicks(el);
}
function renderShop(){
  const el = document.getElementById('shopList');
  el.innerHTML = '';
  for(const it of SHOP){
    const owned = !!S.oneTime[it.id];
    const can = !owned && S.money >= it.cost;
    const d = document.createElement('div');
    d.className = 'up ' + (owned?'owned':(can?'can':'lock'));
    if(!owned){ d.dataset.act = 'shop'; d.dataset.id = it.id; }
    d.innerHTML = `<div class="ico">${it.ico}</div><div class="info"><div class="name">${it.name}${owned?' <span class="badge">куплено</span>':''}</div><div class="desc">${it.desc}</div></div><div class="cost">${owned?'✅':fmt(it.cost)+' ₽'}</div>`;
    el.appendChild(d);
  }
  bindListClicks(el);
}
function renderAch(){
  const el = document.getElementById('achList');
  el.innerHTML = '';
  for(const a of ACHS){
    const done = !!S.achievements[a.id];
    if(!done && a.check(S)){ S.achievements[a.id] = 1; toast(`🏆 ${a.n}!`,'#ffd76e'); }
    const d = document.createElement('div');
    d.className = 'ach' + (done?' done':'');
    d.innerHTML = `<div class="ico">${a.ico}</div><div><div class="n">${a.n}</div><div class="d">${a.d}</div></div>`;
    el.appendChild(d);
  }
}
function renderStat(){
  const el = document.getElementById('statList');
  const minutes = Math.floor(S.playtime/60);
  const hours = Math.floor(minutes/60);
  el.innerHTML = `
    <div class="stat-row"><span>👥 Подписчиков</span><b>${fmt(S.subs)}</b></div>
    <div class="stat-row"><span>💰 Баланс</span><b>${fmt(S.money)} ₽</b></div>
    <div class="stat-row"><span>⭐ Славы</span><b>${fmt(S.fame)}</b></div>
    <div class="stat-row"><span>📹 Роликов</span><b>${fmt(S.posts)}</b></div>
    <div class="stat-row"><span>🔥 Вирусных</span><b>${S.viral}</b></div>
    <div class="stat-row"><span>💥 Скандалов</span><b>${S.scandals}</b></div>
    <div class="stat-row"><span>🚗 Машин</span><b>${(S.cars||[]).length}/${CARS.length}</b></div>
    <div class="stat-row"><span>🏡 Домов</span><b>${(S.houses||[]).length}/${HOUSES.length}</b></div>
    <div class="stat-row"><span>📈 Множитель</span><b>×${globalMult().toFixed(2)}</b></div>
    <div class="stat-row"><span>⏱️ В игре</span><b>${hours}ч ${minutes%60}м</b></div>
    <div class="stat-row"><span>👥 Пассив подп./сек</span><b>${fmt(passiveSubsPerSec())}</b></div>
    <div class="stat-row"><span>💰 Пассив ₽/сек</span><b>${fmt(passiveMoneyPerSec())}</b></div>
    <div class="stat-row"><span>🏆 Достижений</span><b>${Object.keys(S.achievements).length}/${ACHS.length}</b></div>`;
}

/* LOOP */
let last = performance.now();
function loop(now){
  const dt = Math.min(0.5, (now-last)/1000);
  last = now;
  S.playtime += dt;
  S.subs += passiveSubsPerSec() * dt;
  S.money += passiveMoneyPerSec() * dt;
  S.nextEventIn -= dt;
  if(S.nextEventIn <= 0){ tryRandomEvent(); S.nextEventIn = 45 + Math.random()*45; }
  if(Math.floor(now/1000) !== Math.floor((now-dt*1000)/1000)){
    for(const a of ACHS){
      if(!S.achievements[a.id] && a.check(S)){
        S.achievements[a.id] = 1;
        toast(`🏆 ${a.n}!`,'#ffd76e');
        beep(1000,0.15,'triangle',0.08);
      }
    }
  }
  render();
  requestAnimationFrame(loop);
}

/* SAVE */
function save(){
  S.lastSave = Date.now();
  try{ localStorage.setItem('blogger_tycoon_save', JSON.stringify(S)); }catch(e){}
}
function load(){
  try{
    const raw = localStorage.getItem('blogger_tycoon_save') || localStorage.getItem('blogger3_save');
    if(!raw) return JSON.parse(JSON.stringify(DEFAULT));
    const d = JSON.parse(raw);
    const merged = Object.assign({}, JSON.parse(JSON.stringify(DEFAULT)), d);
    if(!merged.cars) merged.cars = [];
    if(!merged.houses) merged.houses = [];
    if(!merged.contentType) merged.contentType = 1;
    return merged;
  }catch(e){ return JSON.parse(JSON.stringify(DEFAULT)); }
}

/* TAP BINDING */
function bindTap(el, fn){
  if(!el) return;
  let lastT = 0;
  let touched = false;
  const handler = (e)=>{
    if(e) e.preventDefault();
    const now = Date.now();
    if(now - lastT < 180) return;
    lastT = now;
    fn();
  };
  el.addEventListener('touchstart', (e)=>{ touched = true; handler(e); }, {passive:false});
  el.addEventListener('mousedown', (e)=>{ if(touched) return; handler(e); });
}

bindTap(document.getElementById('sceneWrap'), doPost);
bindTap(document.getElementById('boost'), buyBoost);
bindTap(document.getElementById('ct-1'), ()=>selectContent(1));
bindTap(document.getElementById('ct-2'), ()=>selectContent(2));
bindTap(document.getElementById('ct-3'), ()=>selectContent(3));
bindTap(document.getElementById('ct-4'), ()=>selectContent(4));

document.querySelectorAll('#tabs .tab').forEach(t=>{
  bindTap(t, ()=>switchTab(t.dataset.t));
});
const popupEl = document.getElementById('popup');
popupEl.addEventListener('touchstart', (e)=>{ if(e.target.id==='popup'){ e.preventDefault(); closePopup(); } }, {passive:false});
popupEl.addEventListener('click', (e)=>{ if(e.target.id==='popup') closePopup(); });

setInterval(save, 5000);
window.addEventListener('beforeunload', save);

render();
requestAnimationFrame(loop);
toast('Добро пожаловать в Блогер TYCOON! 🚀','#7dff9b');
toast('Выбирай тип контента и снимай!','#ffd76e');
toast('Прокачка стала сложнее — целься в топ!','#ff4ec4');
</script>

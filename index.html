<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Блогер 3.0</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
body{font-family:-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(circle at 20% 0%,#2b1055,#0b0416 60%);color:#fff;min-height:100vh;overflow-x:hidden}
#app{max-width:560px;margin:0 auto;padding:8px 10px 84px;position:relative}
.hud{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:8px}
.stat{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:7px 9px}
.stat .lbl{font-size:9px;opacity:.55;text-transform:uppercase;letter-spacing:.5px}
.stat .val{font-size:15px;font-weight:700;margin-top:1px}
.money .val{color:#7dff9b}.subs .val{color:#ff7dd6}.fame .val{color:#ffd76e}
.ebar{height:7px;background:rgba(255,255,255,.1);border-radius:6px;overflow:hidden;margin-bottom:4px}
.efill{height:100%;background:linear-gradient(90deg,#00d4ff,#7d5cff);transition:width .1s linear;border-radius:6px}
.elbl{font-size:10px;opacity:.55;text-align:right;margin-bottom:8px}
.view{display:none;animation:fade .25s}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.scene-wrap{position:relative;width:100%;aspect-ratio:400/340;border-radius:18px;overflow:hidden;box-shadow:0 8px 30px rgba(125,92,255,.35),inset 0 0 0 1px rgba(255,255,255,.08);margin-bottom:10px;background:#0b0416;touch-action:manipulation;cursor:pointer;transition:transform .08s}
.scene-wrap:active{transform:scale(.985)}
#scene{width:100%;height:100%;display:block;pointer-events:none}
.float{position:absolute;pointer-events:none;font-weight:800;font-size:18px;color:#ff7dd6;animation:floatUp 1.1s ease-out forwards;text-shadow:0 0 10px rgba(255,125,214,.85),0 2px 4px rgba(0,0,0,.6);z-index:5}
@keyframes floatUp{0%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-100px) scale(1.35)}}
.hint{font-size:12px;opacity:.6;margin-bottom:10px;text-align:center}
.combo{font-size:20px;font-weight:800;color:#ffd76e;text-shadow:0 0 14px rgba(255,215,110,.9);height:24px;margin:0 0 6px;text-align:center}
.btn{width:100%;padding:12px;border:none;border-radius:12px;background:linear-gradient(135deg,#ff4ec4,#7d5cff);color:#fff;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 5px 16px rgba(255,78,196,.3);margin-bottom:9px}
.btn:disabled{opacity:.32;box-shadow:none}
.btn.active{background:linear-gradient(135deg,#00d4ff,#7d5cff);animation:pulse 1s infinite}
.btn.alt{background:linear-gradient(135deg,#7dff9b,#00d4ff);color:#062;box-shadow:0 5px 16px rgba(125,255,155,.3)}
.btn.danger{background:linear-gradient(135deg,#ff4e4e,#ff9d4e)}
@keyframes pulse{0%,100%{box-shadow:0 5px 16px rgba(0,212,255,.3)}50%{box-shadow:0 5px 25px rgba(0,212,255,.8)}}
.sec{font-size:12px;text-transform:uppercase;letter-spacing:1px;opacity:.5;margin:14px 0 8px;font-weight:700}
.up{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:12px;padding:10px;cursor:pointer;transition:.12s;margin-bottom:7px}
.up:active{transform:scale(.98)}
.up.can{border-color:rgba(125,255,155,.55);background:rgba(125,255,155,.08)}
.up.lock{opacity:.42}
.up.owned{border-color:rgba(255,215,110,.5);background:rgba(255,215,110,.08);opacity:.85;cursor:default}
.up .ico{font-size:24px;width:34px;text-align:center}
.up .info{flex:1;min-width:0}
.up .name{font-weight:700;font-size:13px}
.up .name .lvl{color:#7dff9b;font-size:11px;margin-left:4px}
.up .desc{font-size:10.5px;opacity:.62;margin-top:1px;line-height:1.3}
.up .cost{font-size:12px;font-weight:700;color:#ffd76e;white-space:nowrap}
.plat{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:12px;padding:10px;cursor:pointer;margin-bottom:7px}
.plat.sel{border-color:rgba(125,92,255,.8);background:rgba(125,92,255,.15);box-shadow:0 0 15px rgba(125,92,255,.3)}
.plat.locked{opacity:.4}
.plat .ico{font-size:26px;width:36px;text-align:center}
.plat .info{flex:1}
.plat .name{font-weight:700;font-size:13.5px}
.plat .mult{font-size:10.5px;opacity:.65;margin-top:1px}
.ach{display:flex;gap:9px;padding:9px;background:rgba(255,255,255,.04);border-radius:10px;margin-bottom:6px;border:1px solid rgba(255,255,255,.07);opacity:.4}
.ach.done{opacity:1;border-color:rgba(255,215,110,.5);background:rgba(255,215,110,.07)}
.ach .ico{font-size:22px;width:30px;text-align:center}
.ach .n{font-weight:700;font-size:12.5px}
.ach .d{font-size:10.5px;opacity:.7}
#log{font-size:11.5px;line-height:1.55;max-height:150px;overflow:hidden;margin-top:6px}
#log div{animation:fade .3s;padding:2px 0}
#tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(11,4,22,.96);border-top:1px solid rgba(255,255,255,.09);display:flex;justify-content:space-around;padding:6px 0 10px;backdrop-filter:blur(12px);z-index:50;max-width:560px;margin:0 auto;overflow-x:auto}
#tabs .tab{flex:1;min-width:44px;text-align:center;padding:4px 2px;cursor:pointer;opacity:.5;transition:.15s}
#tabs .tab.on{opacity:1;transform:translateY(-2px)}
#tabs .tab .i{font-size:18px;display:block}
#tabs .tab .l{font-size:8.5px;margin-top:1px;font-weight:600}
#popup{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;backdrop-filter:blur(6px)}
#popup.show{display:flex}
.pop{background:linear-gradient(160deg,#2b1055,#160a2b);border:1px solid rgba(255,255,255,.15);border-radius:18px;padding:22px;max-width:340px;width:100%;text-align:center;animation:popIn .3s}
@keyframes popIn{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.pop h2{font-size:20px;margin-bottom:8px}
.pop p{font-size:13.5px;opacity:.85;line-height:1.5;margin-bottom:16px}
.stat-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:12.5px}
.stat-row b{color:#7dff9b;font-weight:700}
.prestige-box{background:linear-gradient(160deg,rgba(255,215,110,.12),rgba(255,78,196,.1));border:1px solid rgba(255,215,110,.4);border-radius:16px;padding:16px;text-align:center;margin-bottom:14px}
.prestige-box .big{font-size:32px;font-weight:800;color:#ffd76e;text-shadow:0 0 20px rgba(255,215,110,.7)}
.badge{display:inline-block;padding:3px 8px;border-radius:8px;font-size:10px;font-weight:700;background:rgba(255,215,110,.2);color:#ffd76e;margin-left:6px;vertical-align:middle}
</style>
</head>
<body>
<div id="app">
  <div class="hud">
    <div class="stat money"><div class="lbl">Деньги</div><div class="val" id="m">0 ₽</div></div>
    <div class="stat subs"><div class="lbl">Подписчики</div><div class="val" id="s">0</div></div>
    <div class="stat fame"><div class="lbl">Слава ⭐</div><div class="val" id="f">0</div></div>
  </div>
  <div class="ebar"><div class="efill" id="ef"></div></div>
  <div class="elbl" id="el">20/20 ⚡</div>

  <div class="view active" id="v-home">
    <div class="scene-wrap" id="sceneWrap">
      <svg id="scene" viewBox="0 0 400 340" preserveAspectRatio="xMidYMid meet">
        <defs>
          <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
            <stop id="wallTop" offset="0" stop-color="#4a3a6a"/>
            <stop id="wallBot" offset="1" stop-color="#2a1a3a"/>
          </linearGradient>
          <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#2a1830"/>
            <stop offset="1" stop-color="#150a1c"/>
          </linearGradient>
          <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#1a1a4a"/>
            <stop offset="1" stop-color="#4a2a6a"/>
          </linearGradient>
          <linearGradient id="ledGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#ff4ec4"/>
            <stop offset="0.5" stop-color="#7d5cff"/>
            <stop offset="1" stop-color="#00d4ff"/>
          </linearGradient>
          <linearGradient id="carpetGrad" x1="0" y1="0" x2="1" y2="1">
            <stop id="carpet1" offset="0" stop-color="#5a2a4a"/>
            <stop id="carpet2" offset="1" stop-color="#3a1a3a"/>
          </linearGradient>
          <radialGradient id="monGlow" cx="0.5" cy="0.5">
            <stop offset="0" stop-color="#7d5cff" stop-opacity="0.6"/>
            <stop offset="1" stop-color="#7d5cff" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="lampGlow" cx="0.5" cy="0.2">
            <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.9"/>
            <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="ringGlow" cx="0.5" cy="0.5">
            <stop offset="0" stop-color="#fff" stop-opacity="0.6"/>
            <stop offset="1" stop-color="#fff" stop-opacity="0"/>
          </radialGradient>
        </defs>

        <!-- CEILING -->
        <rect x="0" y="0" width="400" height="20" fill="#0a0410"/>
        <rect x="0" y="18" width="400" height="3" fill="#1a0f2a"/>
        <g id="s-led" style="display:none">

          <rect x="0" y="24" width="400" height="14" fill="url(#ledGrad)" opacity="0.35"/>
        </g>

        <!-- WALL -->
        <rect x="0" y="22" width="400" height="220" fill="url(#wallGrad)"/>
        <!-- wallpaper pattern (subtle dots) -->
        <g opacity="0.06">
          <circle cx="20" cy="60" r="1.5" fill="#fff"/>
          <circle cx="60" cy="90" r="1.5" fill="#fff"/>
          <circle cx="100" cy="60" r="1.5" fill="#fff"/>

          <circle cx="360" cy="120" r="1.5" fill="#fff"/>

        <!-- WINDOW (tier 2+) -->
        <g id="s-window" style="display:none">
          <rect x="18" y="45" width="124" height="145" rx="6" fill="#0a0a1e" stroke="#7a6a9a" stroke-width="5"/>
          <rect x="24" y="51" width="112" height="133" fill="url(#skyGrad)"/>
          <!-- stars -->
          <g fill="#fff" opacity="0.8">
            <circle cx="40" cy="65" r="0.9"/>

            <circle cx="55" cy="80" r="0.7"/>

            <rect x="54" y="145" width="8" height="39"/>
            <rect x="64" y="128" width="11" height="56"/>

            <rect x="106" y="142" width="10" height="42"/>
            <rect x="119" y="132" width="14" height="52"/>
          </g>
          <g fill="#ffd76e" opacity="0.9">
            <circle cx="30" cy="145" r="0.8"/><circle cx="33" cy="153" r="0.8"/>
            <circle cx="43" cy="128" r="0.8"/><circle cx="48" cy="138" r="0.8"/>
            <circle cx="68" cy="138" r="0.8"/><circle cx="72" cy="150" r="0.8"/>
            <circle cx="94" cy="132" r="0.8"/><circle cx="98" cy="145" r="0.8"/>
            <circle cx="123" cy="142" r="0.8"/><circle cx="128" cy="152" r="0.8"/>
          </g>
          <!-- street below (through window) -->
          <rect x="24" y="170" width="112" height="14" fill="#0a0a20"/>
          <!-- car in street (dynamic) -->
          <g id="s-car-window" style="display:none"></g>
          <!-- window cross -->
          <line x1="80" y1="51" x2="80" y2="184" stroke="#7a6a9a" stroke-width="3"/>
          <line x1="24" y1="118" x2="136" y2="118" stroke="#7a6a9a" stroke-width="3"/>
          <!-- sill -->
          <rect x="12" y="186" width="136" height="8" rx="2" fill="#7a6a9a"/>

          <g id="s-window-plant" style="display:none">

        </g>

        <!-- POSTERS -->
        <g id="s-posters" style="display:none">
          <rect x="285" y="45" width="46" height="62" rx="3" fill="#4a2a6a" stroke="#7d5cff" stroke-width="2"/>

          <polygon points="356,66 356,78 366,72" fill="#fff"/>
        </g>

        <!-- SHELF (tier 4) -->
        <g id="s-shelf" style="display:none">
          <rect x="230" y="128" width="162" height="5" rx="1" fill="#6a5a8a"/>
          <rect x="236" y="108" width="10" height="20" fill="#7d5cff"/>

          <rect x="258" y="116" width="13" height="12" fill="#00d4ff"/>
          <rect x="274" y="110" width="7" height="18" fill="#ffd76e"/>

          <rect x="290" y="118" width="8" height="10" rx="2" fill="#ff7dd6"/>
          <circle cx="294" cy="115" r="4" fill="#ff7dd6"/>
          <rect x="305" y="115" width="9" height="13" rx="2" fill="#7dff9b"/>
          <circle cx="309.5" cy="112" r="4.5" fill="#7dff9b"/>
          <rect x="322" y="120" width="8" height="8" rx="1.5" fill="#00d4ff"/>
          <circle cx="326" cy="116" r="4" fill="#00d4ff"/>

          <rect x="345" y="100" width="30" height="28" rx="2" fill="#3a2a5a" stroke="#ffd76e" stroke-width="1.5"/>
          <text x="360" y="120" text-anchor="middle" font-size="9" fill="#ffd76e" font-family="sans-serif">★</text>
        </g>

        <!-- FLOOR -->
        <rect x="0" y="242" width="400" height="98" fill="url(#floorGrad)"/>
        <line x1="0" y1="242" x2="400" y2="242" stroke="#000" stroke-width="1.5" opacity="0.5"/>

        <!-- CARPET -->

          <ellipse cx="200" cy="308" rx="180" ry="26" fill="url(#carpetGrad)"/>
          <ellipse cx="200" cy="308" rx="160" ry="20" fill="none" stroke="#ff4ec4" stroke-width="1" opacity="0.4"/>

          <ellipse cx="200" cy="308" rx="80" ry="8" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.4"/>
        </g>

        <!-- FLOOR PLANTS (tier 3+) -->

          <rect x="30" y="222" width="24" height="22" rx="3" fill="#8a5a3a"/>

        </g>

          <rect x="344" y="224" width="22" height="20" rx="3" fill="#8a5a3a"/>
          <path d="M 355 224 Q 355 200 340 190 M 355 224 Q 360 200 370 195 M 355 224 Q 355 205 355 185" fill="none" stroke="#2a8a3a" stroke-width="3" stroke-linecap="round"/>

          <ellipse cx="340" cy="188" rx="5" ry="4" fill="#3a9a4a"/>
          <ellipse cx="370" cy="193" rx="5" ry="4" fill="#3a9a4a"/>
        </g>

        <!-- PET (tier 5+) -->

          <ellipse cx="90" cy="288" rx="16" ry="9" fill="#3a3a3a"/>
          <circle cx="106" cy="286" r="6" fill="#3a3a3a"/>

          <circle cx="108" cy="288" r="1.5" fill="#ff7dd6"/>
        </g>

        <!-- GLOW behind character (from monitor) -->
        <ellipse id="s-glow" cx="200" cy="180" rx="130" ry="90" fill="url(#monGlow)" opacity="0.7"/>

        <!-- MONITORS -->
        <g id="s-monitors">
          <g id="s-mon1">
            <rect x="172" y="118" width="56" height="118" rx="5" fill="#0a0a1a" stroke="#1a1a2e" stroke-width="3"/>
            <rect x="175" y="121" width="50" height="112" rx="3" fill="#141428"/>
            <rect x="179" y="125" width="42" height="10" fill="url(#ledGrad)" opacity="0.75"/>
            <rect x="179" y="139" width="26" height="4" fill="#7d5cff" opacity="0.6"/>
            <rect x="179" y="147" width="34" height="4" fill="#00d4ff" opacity="0.6"/>
            <rect x="179" y="155" width="20" height="4" fill="#ff4ec4" opacity="0.6"/>
            <rect x="179" y="163" width="38" height="4" fill="#7d5cff" opacity="0.6"/>
            <rect x="179" y="171" width="28" height="4" fill="#00d4ff" opacity="0.6"/>
            <rect x="179" y="179" width="42" height="4" fill="#ff4ec4" opacity="0.4"/>
            <rect x="195" y="236" width="10" height="18" fill="#2a2a3a"/>
            <rect x="180" y="254" width="40" height="5" rx="1" fill="#2a2a3a"/>
          </g>
          <g id="s-mon2" style="display:none">
            <rect x="110" y="142" width="58" height="94" rx="4" fill="#0a0a1a" stroke="#1a1a2e" stroke-width="2.5"/>
            <rect x="113" y="145" width="52" height="88" rx="2" fill="#141428"/>
            <rect x="117" y="149" width="44" height="8" fill="url(#ledGrad)" opacity="0.7"/>
            <rect x="117" y="161" width="30" height="4" fill="#00d4ff" opacity="0.55"/>
            <rect x="117" y="169" width="40" height="4" fill="#7d5cff" opacity="0.55"/>
            <rect x="117" y="177" width="24" height="4" fill="#ff4ec4" opacity="0.55"/>
            <rect x="132" y="236" width="8" height="14" fill="#2a2a3a"/>
            <rect x="120" y="250" width="32" height="4" rx="1" fill="#2a2a3a"/>
          </g>
          <g id="s-mon3" style="display:none">
            <rect x="232" y="
